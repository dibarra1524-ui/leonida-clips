name: fast lane (live campaign clips)
on:
  schedule:
    - cron: '*/15 17-23,0-6 * * *'   # every 15 min, 10:00-23:59 Phoenix (UTC-7)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Watch campaign streamers and render rising clips
        env:
          TWITCH_CLIENT_ID: j7tp31gbxy1gt8qrit98dekl4v90j6
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          HOT: '1'
        run: python clipper/fetch.py
      - name: Commit
        run: |
          git config user.name "leonida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue state/seen.json streamers.json
          git diff --cached --quiet && exit 0
          git commit -qm "Hot clips $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
