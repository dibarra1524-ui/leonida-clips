name: transcribe audio
on:
  push:
    branches: [main]
    paths: ['tools/transcribe/*.mp3']
permissions:
  contents: write
jobs:
  tx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-base-en}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          python - <<'P'
          import glob, os
          from faster_whisper import WhisperModel
          m = WhisperModel("base.en", device="cpu", compute_type="int8")
          for f in glob.glob("tools/transcribe/*.mp3"):
              segs, _ = m.transcribe(f, vad_filter=True)
              open(f[:-4] + ".txt", "w").write(" ".join(s.text.strip() for s in segs))
              os.remove(f)
          P
      - run: |
          git config user.name "leonida-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A tools/transcribe
          git commit -qm "Transcribe audio" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
